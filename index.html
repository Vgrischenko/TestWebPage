<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GJ_interiorvisualization</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .nav {
            background-color: rgba(51, 51, 51, 0.8);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            width: 100%;
            z-index: 100;
        }

        .nav .logo {
            color: #f2f2f2;
            text-decoration: none;
            font-size: 1.5em;
            font-weight: bold;
        }

        .nav .menu {
            display: flex;
			margin-right: 50px;
            gap: 20px;
        }

        .nav .menu a {
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        .nav .menu a:hover {
            background-color: #ddd;
            color: black;
        }

        .hero {
    background-image: url('img/portret_background.png');
    height: 100%;
   	max-height: inherit
	background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    position: relative;
    max-width: none;
        }

        .hero h2 {
    font-size: 2em;
    vertical-align: baseline;
    margin-left: 10%;
    width: 100%;
    color: inherit;
	font-weight: lighter;
	text-shadow: 1px 3px 5px #000000
    }
		.hero h1 {
    font-size: 3em;
    vertical-align: baseline;
    margin-left: 10%;
    width: 100%;
    color: inherit;
	font-style: italic;
	text-shadow: 1px 3px 5px #000000
    }
		.red-text {
		color: #FF0004;
		}
		
		.gold-text {
    color: #FFE093;
    font-weight: 900;
	text-shadow: 1px 3px 5px #000000
		}
		
        .hero button {
			margin-left: 5%;
            margin-top: 10px;
			padding: 10px 20px;
			vertical-align: 10px;
            font-size: 1.2em;
            border: none;
            background-color: #333;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .hero button:hover {
    background-color: #000000;
        }
		.contact {
            background-color: #333;
            color: #f2f2f2;
            padding: 20px;
            text-align: center;
        }

        .contact a {
            color: #f2f2f2;
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .project {
                min-width: calc(50% - 40px);
            }
        }

        @media (max-width: 280px) {
            .project {
                min-width: 100%;
            }
</style>
</head>
<body>

			<a href="about.html#contact">Pricelist</a>

        </div>
    </div>

    <div class="hero">
      <blockquote>
        <h2>Bring Your <span class="gold-text"> Designs </span> to <span class="gold-text">Life</span>: <br>
          Professional Interior and Exterior Visualization</h2>
	<div>
	  <h1>Julia Grishchenko </h1>
	</div>
      </blockquote>
      <button onclick="window.location.href='about.html'">About me</button>
	</div>
